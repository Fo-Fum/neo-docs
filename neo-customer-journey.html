<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Customer Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green:#009876; --green-dark:#007a5e; --green-wash:#f0faf7;
    --yellow:#FFB838; --ink:#1a1a1a; --ink-mid:#4E4A47; --ink-light:#7a7673;
    --rule:#e2ddd8; --bg:#faf9f7;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:'Montserrat',sans-serif;background:var(--ink);}

  /* ── INTRO SCREEN ── */
  .intro{
    position:fixed;inset:0;background:var(--ink);z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 32px;text-align:center;
  }
  .intro-mark{
    width:64px;height:64px;border:2px solid rgba(255,255,255,0.2);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:0 auto 24px;
  }
  .intro-mark .m-cafe{font-size:6px;font-weight:800;letter-spacing:.15em;color:rgba(255,255,255,0.4);text-transform:uppercase;}
  .intro-mark .m-neo{font-size:20px;font-weight:800;color:#fff;letter-spacing:.04em;line-height:1;}
  .intro-mark .m-rule{width:14px;height:1px;background:var(--green);margin:2px 0;}
  .intro-mark .m-eatery{font-size:5px;font-weight:800;letter-spacing:.15em;color:rgba(255,255,255,0.35);text-transform:uppercase;}
  .intro-eyebrow{font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
  .intro-title{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.1;margin-bottom:10px;}
  .intro-sub{font-size:13px;font-weight:500;color:rgba(255,255,255,.45);line-height:1.65;margin-bottom:36px;max-width:280px;}
  .intro-sub em{color:rgba(255,255,255,.75);font-style:normal;font-weight:700;}
  .intro-meta{display:flex;gap:24px;margin-bottom:40px;}
  .intro-meta-item{text-align:center;}
  .intro-meta-num{font-size:28px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1;}
  .intro-meta-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-top:3px;}
  .intro-start{
    width:100%;max-width:300px;padding:17px;background:var(--green);color:#fff;
    border:none;border-radius:4px;font-family:'Montserrat',sans-serif;
    font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    cursor:pointer;transition:background .15s;
  }
  .intro-start:active{background:var(--green-dark);}

  /* ── MAIN APP ── */
  #app{height:100%;display:none;flex-direction:column;}

  /* ── TOP BAR ── */
  .topbar{
    background:var(--ink);padding:calc(var(--safe-top) + 14px) 22px 14px;
    flex-shrink:0;
  }
  .tb-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .tb-back{
    color:rgba(255,255,255,.4);font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .tb-back:active{color:rgba(255,255,255,.8);}
  .tb-step-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.06em;}

  /* PROGRESS BAR */
  .progress-track{height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s cubic-bezier(.32,.72,0,1);}

  /* ── CARD STAGE ── */
  .stage{flex:1;overflow:hidden;position:relative;}
  .cards-wrap{
    display:flex;height:100%;
    transition:transform .4s cubic-bezier(.32,.72,0,1);
    will-change:transform;
  }
  .card{
    flex-shrink:0;width:100%;height:100%;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:28px 22px calc(100px + var(--safe-bottom));
    background:var(--bg);
  }

  /* ── CARD CONTENT ── */
  .c-num{font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
  .c-title{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:20px;color:var(--ink);}

  .c-bullets{margin-bottom:22px;}
  .c-bullet{
    display:flex;align-items:flex-start;gap:12px;
    padding:12px 0;border-bottom:1px solid var(--rule);
  }
  .c-bullet:last-child{border-bottom:none;}
  .c-dot{
    width:7px;height:7px;border-radius:50%;background:var(--green);
    flex-shrink:0;margin-top:5px;
  }
  .c-bullet-text{font-size:13px;font-weight:500;color:var(--ink-mid);line-height:1.6;}

  .c-standard{
    background:var(--ink);border-radius:4px;padding:18px 18px;margin-bottom:14px;
    border-left:3px solid var(--green);
  }
  .c-std-label{font-size:8px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
  .c-std-text{font-size:13px;font-weight:600;color:rgba(255,255,255,.8);line-height:1.7;font-style:italic;}

  .c-principle{
    background:var(--green-wash);border-radius:4px;padding:14px 16px;
    border-left:3px solid var(--green);
  }
  .c-prin-label{font-size:8px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:6px;}
  .c-prin-text{font-size:13px;font-weight:800;color:var(--green-dark);line-height:1.5;}

  /* FINISH CARD */
  .card.finish{
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:40px 32px;background:var(--ink);
  }
  .finish-star{font-size:48px;margin-bottom:20px;}
  .finish-rule{width:28px;height:2px;background:var(--green);margin:0 auto 20px;}
  .finish-title{font-size:26px;font-weight:800;color:#fff;margin-bottom:12px;letter-spacing:-.02em;}
  .finish-quote{
    font-size:14px;font-weight:600;color:rgba(255,255,255,.6);
    line-height:1.75;margin-bottom:32px;font-style:italic;max-width:280px;
  }
  .finish-quote em{color:var(--green);font-style:normal;font-weight:700;}
  .finish-restart{
    padding:15px 32px;background:var(--green);color:#fff;border:none;
    border-radius:4px;font-family:'Montserrat',sans-serif;font-size:12px;
    font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    margin-bottom:12px;width:100%;max-width:280px;
  }
  .finish-restart:active{background:var(--green-dark);}
  .finish-back{
    padding:13px 32px;background:transparent;color:rgba(255,255,255,.35);
    border:1.5px solid rgba(255,255,255,.12);border-radius:4px;
    font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    width:100%;max-width:280px;
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:#fff;border-top:1px solid var(--rule);
    padding:12px 22px calc(12px + var(--safe-bottom));
    display:flex;align-items:center;gap:10px;
    box-shadow:0 -4px 20px rgba(0,0,0,.06);z-index:50;
  }
  .nav-btn{
    flex:1;padding:14px;border-radius:3px;border:none;
    font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s;
  }
  .nav-btn.prev{background:transparent;color:var(--ink-light);border:1.5px solid var(--rule);}
  .nav-btn.prev:active{background:var(--bg);}
  .nav-btn.next{background:var(--ink);color:#fff;}
  .nav-btn.next:active{background:#333;}
  .nav-btn.finish{background:var(--green);color:#fff;}
  .nav-btn.finish:active{background:var(--green-dark);}
  .nav-btn:disabled{opacity:.28;pointer-events:none;}
  .nav-counter{font-size:11px;font-weight:700;color:var(--ink-light);letter-spacing:.04em;white-space:nowrap;text-align:center;min-width:44px;}

  /* SWIPE HINT */
  .swipe-hint{
    position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border-radius:20px;
    pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap;
  }
  .swipe-hint.show{opacity:1;}
</style>
</head>
<body>

<!-- ── INTRO ── -->
<div class="intro" id="intro">
  <div class="intro-mark">
    <span class="m-cafe">Cafe</span>
    <span class="m-rule"></span>
    <span class="m-neo">Neo</span>
    <span class="m-rule"></span>
    <span class="m-eatery">Eatery</span>
  </div>
  <div class="intro-eyebrow">Training · Service</div>
  <div class="intro-title">The Customer Journey</div>
  <div class="intro-sub">Service is what we do.<br><em>Hospitality is how we make people feel.</em></div>
  <div class="intro-meta">
    <div class="intro-meta-item">
      <div class="intro-meta-num">9</div>
      <div class="intro-meta-label">Steps</div>
    </div>
    <div class="intro-meta-item">
      <div class="intro-meta-num">~5</div>
      <div class="intro-meta-label">Minutes</div>
    </div>
    <div class="intro-meta-item">
      <div class="intro-meta-num">★</div>
      <div class="intro-meta-label">Standard</div>
    </div>
  </div>
  <button class="intro-start" onclick="startJourney()">Begin the Journey →</button>
</div>

<!-- ── APP ── -->
<div id="app">
  <div class="topbar">
    <div class="tb-row">
      <div class="tb-back" onclick="goIntro()">← Exit</div>
      <div class="tb-step-label" id="stepLabel">Step 1 of 9</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:11%"></div>
    </div>
  </div>

  <div class="stage">
    <div class="cards-wrap" id="cardsWrap"></div>
    <div class="swipe-hint" id="swipeHint">Swipe to navigate</div>
  </div>

  <div class="bottom-nav" id="bottomNav">
    <button class="nav-btn prev" id="prevBtn" onclick="go(-1)" disabled>← Back</button>
    <span class="nav-counter" id="navCounter">1 / 9</span>
    <button class="nav-btn next" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>

<script>
const STEPS = [
  {
    num:"01", title:"Arrival & First Impression",
    bullets:[
      "Acknowledge within 5 seconds — eye contact, warm smile",
      "Calm, welcoming tone and clear direction",
      "If there's a wait: give honest timeframe, offer menus",
      "Update customers if the wait extends beyond what was communicated"
    ],
    standard:"\"Good morning — welcome to Neo. Have you been in before? There's about a 15-minute wait, but we've got you on the list. Stick with us and we'll come find you when your table's ready.\"",
    principle:"This is the moment a visitor becomes your customer."
  },
  {
    num:"02", title:"Seating, Drinks & Menu",
    bullets:[
      "Set the table neatly before customers are seated",
      "Offer drinks promptly — read the table",
      "Confirm dietary requirements early",
      "Enter the drinks order without delay"
    ],
    standard:"Body language matters: upright posture, open and calm, unhurried. Your composure tells the customer everything is under control.",
    principle:"Calm composure sets the tone for the whole visit."
  },
  {
    num:"03", title:"Order Taking",
    bullets:[
      "Know the menu with confidence: ingredients, allergens, modifications",
      "Make genuine recommendations when asked",
      "Repeat the order back clearly and confirm any changes",
      "Never guess on allergens — always check with the kitchen"
    ],
    standard:"\"The hash stack is our house-made hash brown, topped with smashed avocado, feta, fresh herbs, and a soft poached egg — it's one of the favourites.\"",
    principle:"Confident, specific answers build trust. Vague answers undermine it."
  },
  {
    num:"04", title:"Coffee & Food Timing",
    bullets:[
      "Coffee lands first — always, unless the customer requests otherwise",
      "Communicate delays before customers feel the need to ask",
      "Keep the kitchen and pass informed — proactive communication prevents problems"
    ],
    standard:"\"Thanks so much for your patience — your coffees are being poured right now and will be with you in just a moment.\"",
    principle:"Get timing right and the whole experience flows."
  },
  {
    num:"05", title:"Food Service & Check-In",
    bullets:[
      "Know the dish before you pick it up — place it with intention",
      "Never auction food at the table",
      "Return 1–2 minutes after food is served",
      "Ask genuinely: \"How is everything tasting?\""
    ],
    standard:"\"Big Breakfast with scrambled eggs.\" — Know the table, know the dish, deliver it with confidence.",
    principle:"Issues are far easier to resolve when caught early."
  },
  {
    num:"06", title:"Clearing & Table Maintenance",
    bullets:[
      "Clear once the whole table has finished, or when plates are being pushed aside",
      "Keep water topped up throughout the visit",
      "Work efficiently — never in a way that feels rushed or dismissive",
      "Reset with care: straight cutlery, clean surfaces, properly aligned chairs"
    ],
    standard:"There are no quick resets at Neo. Every table deserves the same care as the first one of the day.",
    principle:"The details customers notice most are often the ones they couldn't articulate."
  },
  {
    num:"07", title:"Second Round Opportunity",
    bullets:[
      "Offer another coffee or something from the cabinet",
      "Warm and genuine — never with pressure",
      "Read the table: are they relaxed and lingering?"
    ],
    standard:"\"Can I tempt you with another coffee, or something from the cabinet?\"",
    principle:"Offer with warmth. Never with pressure."
  },
  {
    num:"08", title:"Closing the Table",
    bullets:[
      "Ask once more if there's anything they need",
      "Thank them sincerely — look at them, not the table",
      "Invite them to settle up at the counter when they're ready"
    ],
    standard:"\"Thanks so much for coming in today — we'll see you again soon.\" To a regular: \"See you next week.\"",
    principle:"The farewell is your last chance to make them feel valued."
  },
  {
    num:"09", title:"Payment & Farewell",
    bullets:[
      "Ask how everything was — address issues, receive praise and pass it on",
      "Find a genuine moment of connection, even in thirty seconds",
      "Warm farewell always: \"Enjoy the rest of your day — thanks for coming in.\""
    ],
    standard:"The till is our final touchpoint. It is the last impression we leave.",
    principle:"Make the last moment as warm as the first."
  }
];

let current = 0;
const total = STEPS.length;

function buildCards() {
  const wrap = document.getElementById("cardsWrap");
  wrap.innerHTML = "";

  STEPS.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="c-num">Step ${s.num} of 09</div>
      <div class="c-title">${s.title}</div>
      <div class="c-bullets">
        ${s.bullets.map(b=>`<div class="c-bullet"><div class="c-dot"></div><div class="c-bullet-text">${b}</div></div>`).join("")}
      </div>
      <div class="c-standard">
        <div class="c-std-label">Neo Standard</div>
        <div class="c-std-text">${s.standard}</div>
      </div>
      <div class="c-principle">
        <div class="c-prin-label">★ Remember</div>
        <div class="c-prin-text">${s.principle}</div>
      </div>
    `;
    wrap.appendChild(card);
  });

  // Finish card
  const fin = document.createElement("div");
  fin.className = "card finish";
  fin.innerHTML = `
    <div class="finish-star">★</div>
    <div class="finish-rule"></div>
    <div class="finish-title">Journey Complete</div>
    <div class="finish-quote">Neo hospitality is not about extravagance.<br>It is about <em>caring more than expected</em> —<br>every table, every shift, every day.</div>
    <button class="finish-restart" onclick="restart()">↺ Start Again</button>
    <button class="finish-back" onclick="goIntro()">← Back to Hub</button>
  `;
  wrap.appendChild(fin);
}

function updateUI() {
  const isFinish = current === total;
  const pct = isFinish ? 100 : Math.round(((current + 1) / total) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("stepLabel").textContent = isFinish ? "Complete" : `Step ${current + 1} of ${total}`;
  document.getElementById("navCounter").textContent = isFinish ? "✓" : `${current + 1} / ${total}`;
  document.getElementById("cardsWrap").style.transform = `translateX(-${current * 100}%)`;

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  prevBtn.disabled = current === 0;
  if (isFinish) {
    nextBtn.style.display = "none";
    document.getElementById("bottomNav").style.display = "none";
  } else {
    nextBtn.style.display = "";
    document.getElementById("bottomNav").style.display = "flex";
    nextBtn.textContent = current === total - 1 ? "Finish ★" : "Next →";
    nextBtn.className = current === total - 1 ? "nav-btn finish" : "nav-btn next";
  }
}

function go(dir) {
  const next = current + dir;
  if (next < 0 || next > total) return;
  current = next;
  updateUI();
  // Scroll card to top
  const cards = document.querySelectorAll(".card");
  if (cards[current]) cards[current].scrollTop = 0;
}

function restart() {
  current = 0;
  updateUI();
  document.getElementById("bottomNav").style.display = "flex";
}

function startJourney() {
  document.getElementById("intro").style.display = "none";
  const app = document.getElementById("app");
  app.style.display = "flex";
  buildCards();
  updateUI();
  // Show swipe hint briefly
  const hint = document.getElementById("swipeHint");
  hint.classList.add("show");
  setTimeout(() => hint.classList.remove("show"), 2200);
  // Touch swipe
  initSwipe();
}

function goIntro() {
  document.getElementById("app").style.display = "none";
  document.getElementById("intro").style.display = "flex";
  current = 0;
}

// ── SWIPE ──
function initSwipe() {
  const stage = document.querySelector(".stage");
  let startX = 0, startY = 0, isDragging = false;
  stage.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isDragging = true;
  }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (!isDragging) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 44) {
      go(dx < 0 ? 1 : -1);
    }
    isDragging = false;
  }, { passive: true });
}
</script>

<!-- ══ BACK TO HUB BUTTON ══ -->
<a href="https://fo-fum.github.io/neo-docs/" 
  style="position:fixed;bottom:28px;left:28px;z-index:999;
         background:#1a1a1a;color:#fff;border-radius:50px;
         padding:10px 18px;font-family:Montserrat,sans-serif;
         font-size:11px;font-weight:800;letter-spacing:.08em;
         cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.18);
         display:flex;align-items:center;gap:8px;
         text-decoration:none;transition:background .2s;"
  onmouseover="this.style.background='#009876'"
  onmouseout="this.style.background='#1a1a1a'">
  ← Back to Hub
</a>

</body>
</html>
